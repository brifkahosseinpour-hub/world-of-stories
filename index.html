<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>خانه داستان</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}

body{
    background:#080706;
    color:#ead6b5;
}

header{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,#3b2b1d 0%,#15100c 40%,#080706 80%);
}

.container{
    width:90%;
    max-width:900px;
    text-align:center;
    padding:60px 40px;
    background:rgba(18,13,10,.9);
    border:1px solid #806040;
    border-radius:35px;
    box-shadow:0 0 60px rgba(220,180,120,.12);
}

h1{
    font-size:65px;
    color:#f3d8aa;
    margin-bottom:25px;
}

.subtitle{
    font-size:22px;
    color:#c7a77c;
    line-height:2;
}

.menu{
    margin-top:45px;
}

.menu a{
    display:inline-block;
    margin:10px;
    padding:16px 45px;
    border-radius:35px;
    text-decoration:none;
    color:#f0d09c;
    border:1px solid #b18a55;
    transition:.4s;
}

.menu a:hover{
    background:#c69a61;
    color:#100b07;
}

.cards{
    display:flex;
    gap:20px;
    justify-content:center;
    margin-top:50px;
    flex-wrap:wrap;
}

.card{
    width:250px;
    padding:25px;
    background:#15100c;
    border-radius:20px;
    border:1px solid #3d2c1c;
}

.card h2{
    color:#e7c58d;
    margin-bottom:15px;
}

.card p{
    color:#bda17a;
    line-height:1.8;
}

</style>
</head>

<body>

<header>

<div class="container">

<h1>داستان من</h1>

<p class="subtitle">
به دنیایی از رازها، ماجراها و قصه‌های فراموش‌نشدنی خوش آمدید
</p>

<div class="menu">
<a href="#">ورود</a>
<a href="#">داستان‌ها</a>
</div>


<div class="cards">

<div class="card">
<h2>قصه‌ها</h2>
<p>داستان‌های جدید و متفاوت را بخوانید.</p>
</div>

<div class="card">
<h2>رازها</h2>
<p>پشت هر داستان یک راز پنهان است.</p>
</div>

</div>

</div>

</header>

</body>
</html>
